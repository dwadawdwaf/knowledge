name: Backend checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
      KS_TEST_FONT_PATH: /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      # 只安装系统字体；数据库由与本地相同的隔离脚本启动。
      - name: Install Chinese test font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: Install locked dependencies
        run: python -m pip install -r backend/requirements-dev.lock
      - name: Run complete checks
        run: python -u backend/scripts/check.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Frontend protocol checks
        run: |
          node --check frontend/app.mjs
          node --test frontend/core.test.mjs
