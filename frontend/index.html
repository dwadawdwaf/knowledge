<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' blob:; img-src 'self' data: blob:; font-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>知页 · 知识工作台</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip" href="#content">跳到主要内容</a>

  <div class="mobile-bar">
    <button id="nav-toggle" class="icon-btn" type="button" aria-label="打开导航" data-icon="menu"></button>
    <span class="mobile-title">知页</span>
    <button id="mobile-new-chat" class="icon-btn" type="button" aria-label="新建对话" data-icon="pen"></button>
  </div>
  <div class="scrim" id="scrim" hidden></div>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="工作台导航">
      <div class="side-head">
        <a class="brand" href="#knowledge" id="brand">
          <span class="brand-mark" aria-hidden="true">知</span>
          <span class="brand-text">知页</span>
        </a>
        <div class="side-head-actions">
          <button class="icon-btn" id="new-chat" type="button" aria-label="新建对话" title="新建对话" data-icon="pen"></button>
          <button class="icon-btn" id="collapse" type="button" aria-label="收起侧边栏" title="收起侧边栏" data-icon="panel"></button>
        </div>
      </div>

      <nav class="nav" aria-label="主导航">
        <button class="nav-item" type="button" data-page="chat"><span class="nav-icon" data-icon="chat"></span><span class="nav-text">对话</span></button>
        <button class="nav-item" type="button" data-page="knowledge"><span class="nav-icon" data-icon="library"></span><span class="nav-text">知识库</span></button>
        <button class="nav-item" type="button" data-page="files"><span class="nav-icon" data-icon="folder"></span><span class="nav-text">全部文件</span></button>
        <button class="nav-item" type="button" data-page="search"><span class="nav-icon" data-icon="search"></span><span class="nav-text">检索测试</span></button>
      </nav>

      <div class="side-fill">
        <section class="side-section" aria-label="对话历史">
          <div class="side-section-head">
            <span>对话历史</span>
            <span class="side-count" id="session-count"></span>
          </div>
          <div class="session-list" id="session-list"></div>
          <p class="side-empty" id="session-empty">还没有对话<br><span>提问后自动保存，重新连接后仍可查看</span></p>
        </section>
      </div>

      <div class="side-foot">
        <a class="side-link" href="/docs" target="_blank" rel="noreferrer">
          <span class="nav-icon" data-icon="book"></span><span class="nav-text">接口文档</span><span class="side-link-arrow">↗</span>
        </a>
        <div class="user-row">
          <button class="user-card" id="connection" type="button">
            <span class="avatar" aria-hidden="true">我</span>
            <span class="user-meta"><strong id="connection-label">未连接</strong><small>开发访问令牌</small></span>
            <span class="user-cog" data-icon="settings" aria-hidden="true"></span>
          </button>
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深浅色" title="切换深浅色" data-icon="moon"></button>
        </div>
      </div>
    </aside>

    <main id="content" class="main" tabindex="-1"></main>
  </div>

  <div id="notice" role="status" aria-live="polite" hidden></div>

  <dialog id="connection-dialog" class="modal" tabindex="-1">
    <form id="connection-form" class="modal-card">
      <div class="modal-head">
        <div class="modal-title"><span class="modal-mark" aria-hidden="true">知</span><h2>连接知识工作台</h2></div>
        <button type="button" class="icon-btn" data-close aria-label="关闭连接窗口" data-icon="x"></button>
      </div>
      <p class="modal-desc">沿用后端开发令牌，不创建账号或新的身份。</p>
      <label class="field-label" for="token">开发访问令牌</label>
      <input id="token" class="input" type="password" autocomplete="off" placeholder="粘贴访问令牌，不含 Bearer 前缀" required>
      <p class="field-hint">在启动终端输入 <code>/token</code> 获取本次开发令牌。令牌只存在页面内存中，刷新后需要重新连接；对话历史保存在后端，重连后自动加载。</p>
      <p id="connect-error" class="error-text" role="alert"></p>
      <button class="btn primary full" id="connect-submit" type="submit">连接工作台</button>
      <p class="modal-note"><span data-icon="shield"></span>仅连接同源 API，不向其他网站传递令牌。</p>
    </form>
  </dialog>

  <dialog id="action-dialog" class="modal" tabindex="-1">
    <form id="action-form" class="modal-card">
      <div class="modal-head">
        <h2 id="action-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="关闭操作窗口" data-icon="x"></button>
      </div>
      <p id="action-description" class="modal-desc"></p>
      <label class="field-label" id="action-label" for="action-input">知识库名称</label>
      <input id="action-input" class="input" maxlength="200" autocomplete="off">
      <p id="action-error" class="error-text" role="alert"></p>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close>取消</button>
        <button id="action-submit" class="btn primary" type="submit">确认</button>
      </div>
    </form>
  </dialog>

  <dialog id="source-dialog" class="drawer" tabindex="-1">
    <header class="drawer-head">
      <div><span class="eyebrow">引用原文</span><h2>证据片段</h2></div>
      <button type="button" class="icon-btn" data-close aria-label="关闭引用原文" data-icon="x"></button>
    </header>
    <div class="drawer-body" id="source-content"></div>
  </dialog>

  <dialog id="chunks-dialog" class="drawer wide" tabindex="-1">
    <header class="drawer-head">
      <div><span class="eyebrow">分块视图</span><h2>分段结果</h2></div>
      <button type="button" class="icon-btn" data-close aria-label="关闭分块结果" data-icon="x"></button>
    </header>
    <div class="drawer-body" id="chunks-content"></div>
  </dialog>
</body>
</html>
