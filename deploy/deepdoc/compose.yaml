services:
  deepdoc:
    image: ${DEEPDOC_IMAGE:-ks-deepdoc-local:deepdoc-v0.22.0-v2}
    build:
      context: ../..
      dockerfile: deploy/deepdoc/Dockerfile
      args:
        RAGFLOW_IMAGE: ${RAGFLOW_IMAGE:-infiniflow/ragflow:v0.22.0}
    environment:
      DEEPDOC_TOKEN: ${DEEPDOC_TOKEN:?请设置至少32字符的随机令牌}
    # 内部网络禁止运行期下载/外发；模型必须由镜像预置。
    networks: [isolated]
    mem_limit: 6g
    cpus: 2
    pids_limit: 256
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
  gateway:
    # 复用同一镜像已带的 Nginx；不启动 Python，也不加载解析模型。
    image: ${DEEPDOC_IMAGE:-ks-deepdoc-local:deepdoc-v0.22.0-v2}
    pull_policy: never
    entrypoint: ["nginx", "-c", "/opt/ks/gateway.conf", "-g", "daemon off;"]
    user: "65534:65534"
    depends_on: [deepdoc]
    ports:
      - "127.0.0.1:9381:9381"
    networks: [ingress, isolated]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
networks:
  isolated:
    internal: true
  ingress:
